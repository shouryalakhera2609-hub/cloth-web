<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore sarees, blouses, kurtas, and daily essentials at Shubh Collection and General Store."
    />
    <title>Shubh Collection and General Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <button id="signin-button" class="signin-badge" type="button" aria-label="Google sign in">
        <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z" />
          <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z" />
          <path fill="#FBBC05" d="M12.6 27.7a12 12 0 0 1 0-7.4V15H5.8a20 20 0 0 0 0 18l6.8-5.3Z" />
          <path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.8 29.5 4 24 4A20 20 0 0 0 5.8 15l6.8 5.3c1.6-4.8 6.1-8.4 11.4-8.4Z" />
        </svg>
        <span>Sign in</span>
      </button>
      <button id="add-product-button" class="add-product-button" type="button" hidden>Add</button>
      <dialog id="login-dialog" class="login-dialog">
        <form id="login-form" method="dialog">
          <button class="dialog-close" type="button" aria-label="Close">×</button>
          <h2>Sign in</h2>
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required />
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          <p id="login-error" class="login-error" role="alert"></p>
          <button class="login-submit" type="submit">Sign in</button>
        </form>
      </dialog>
    </header>

    <main class="container">
      <section class="hero" aria-labelledby="store-title">
        <p class="eyebrow">WELCOME TO OUR STORE</p>
        <h1 id="store-title">Shubh Collection and General Store</h1>
        <p class="tagline">✨ Latest Fashion &amp; Daily Needs — All in One Place ✨</p>
        <label class="search-box">
          <span class="visually-hidden">Search products</span>
          <input id="search" type="search" placeholder="Search saree, blouse, kurta..." />
          <span class="search-icon" aria-hidden="true">⌕</span>
        </label>
        <nav class="filters" aria-label="Filter products">
          <button class="filter-button active" type="button" data-category="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-category="saree" aria-pressed="false">Saree</button>
          <button class="filter-button" type="button" data-category="blouse" aria-pressed="false">Blouse</button>
          <button class="filter-button" type="button" data-category="kurta" aria-pressed="false">Kurta</button>
        </nav>
      </section>

      <section class="collection" aria-labelledby="collection-title">
        <h2 id="collection-title">Our Collection</h2>
        <div class="section-rule" aria-hidden="true"></div>
        <p id="error" class="error" role="alert"></p>
        <div id="items" class="grid" aria-live="polite"></div>
      </section>

      <dialog id="product-dialog" class="product-dialog">
        <form id="item-form" class="product-form">
          <button class="product-dialog-close" type="button" aria-label="Close">×</button>
          <h2>Add Product</h2>
          <label for="title">Product name <span>(optional)</span></label>
          <input id="title" name="title" placeholder="e.g. Embroidered saree" />
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="saree">Saree</option>
            <option value="blouse">Blouse</option>
            <option value="kurta">Kurta</option>
          </select>
          <label for="product-number">Product number</label>
          <input id="product-number" name="productNumber" type="number" readonly />
          <label for="price">Price</label>
          <input id="price" name="price" type="number" min="1" step="0.01" required />
          <label for="description">Description <span>(optional)</span></label>
          <textarea id="description" name="description" placeholder="Add a short description"></textarea>
          <label for="image">Product photo <span>(optional when editing)</span></label>
          <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp" />
          <small id="image-size">Photo will be optimized to 200-300 KB.</small>
          <p id="product-error" class="login-error" role="alert"></p>
          <button id="submit-btn" type="submit">Add to collection</button>
        </form>
      </dialog>

      <footer>Shubh Collection and General Store</footer>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
